<head>

<body>
<div id="probe-t"></div><div id="probe-b"></div>

<!-- Accueil (mis en page par js/home.js ; les modules y ajoutent leurs boutons) -->
<section class="screen on" id="s-title">
  <button class="icon glass gear" id="b-set2" aria-label="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
  <div class="title-wrap">
    <h1 class="logo">CRITICAL</h1>
    <p class="tag">Fusionne les astres. Crée ta galaxie.</p>
    <div class="menu"></div>
    <p class="foot" id="t-stars"></p>
  </div>
</section>

<div class="modal" id="m-settings">
  <div class="card glass">
    <h2>Réglages</h2>
    <p class="set-h">Son</p>
    <label class="sw"><span>Effets sonores</span><input type="checkbox" id="o-sfx"><i></i></label>
    <label class="sw"><span>Musique</span><input type="checkbox" id="o-mus"><i></i></label>
    <p class="set-h">Jeu</p>
    <label class="sw"><span>Vibrations</span><input type="checkbox" id="o-vib"><i></i></label>
    <label class="sw"><span>Fantôme du rival<small>Rejoue la partie du joueur au-dessus de toi. Consomme plus de batterie.</small></span><input type="checkbox" id="o-gh"><i></i></label>
    <p class="set-h">Compte</p>
    <button class="set-row" id="o-prof"><span>Mon profil</span><small id="o-name"></small></button>
    <div class="btns"><button class="big primary" id="o-close">Fermer</button></div>
    <p class="credits">Crédits : Zeyn — Mohamed Zerouati<br>Contact : <a href="mailto:zeynzer1@gmail.com">zeynzer1@gmail.com</a></p>
  </div>
</div>

<div id="toast"></div>
<div id="splash"><b>Zeyn's Games</b><span>Appuie pour jouer</span></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
